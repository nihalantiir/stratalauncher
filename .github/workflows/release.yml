name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches every version file
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $mismatches = @()
          if ($tagVersion -ne $cargoVersion) { $mismatches += "src-tauri/Cargo.toml ($cargoVersion)" }
          if ($tagVersion -ne $packageVersion) { $mismatches += "package.json ($packageVersion)" }
          if ($tagVersion -ne $tauriVersion) { $mismatches += "src-tauri/tauri.conf.json ($tauriVersion)" }
          if ($mismatches.Count -gt 0) {
            Write-Error "Tag ${{ github.ref_name }} doesn't match: $($mismatches -join ', '). Bump every version file and commit before tagging."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            updater -> target

      - name: Write release secrets
        shell: pwsh
        env:
          STRATA_MS_CLIENT_ID: ${{ secrets.STRATA_MS_CLIENT_ID }}
          STRATA_CURSEFORGE_API_KEY: ${{ secrets.STRATA_CURSEFORGE_API_KEY }}
          STRATA_PASTEBIN_API_KEY: ${{ secrets.STRATA_PASTEBIN_API_KEY }}
        run: |
          @"
          STRATA_MS_CLIENT_ID=$env:STRATA_MS_CLIENT_ID
          STRATA_CURSEFORGE_API_KEY=$env:STRATA_CURSEFORGE_API_KEY
          STRATA_PASTEBIN_API_KEY=$env:STRATA_PASTEBIN_API_KEY
          "@ | Set-Content -Path src-tauri/secrets.release.env -Encoding utf8

      - name: Build main app
        # cargo build alone never enables Tauri's custom-protocol feature,
        # which is what actually loads embedded assets instead of devUrl.
        run: npx tauri build --no-bundle

      - name: Build updater
        run: cargo build --release --manifest-path updater/Cargo.toml

      - name: Assemble release archive
        id: assemble
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $staging = "strata-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item src-tauri/target/release/strata.exe "$staging/strata.exe"
          Copy-Item updater/target/release/strata-updater.exe "$staging/strata-updater.exe"
          Copy-Item LICENSE "$staging/LICENSE"
          Copy-Item README.md "$staging/README.md"
          $zipName = "$staging.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $zipName
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Write latest.json
        shell: pwsh
        run: |
          $manifest = @{
            version = "${{ steps.assemble.outputs.version }}"
            windows = @{
              url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.assemble.outputs.zip_name }}"
              sha256 = "${{ steps.assemble.outputs.sha256 }}"
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding utf8

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ steps.assemble.outputs.zip_name }}" `
            "latest.json" `
            --title "${{ github.ref_name }}" `
            --generate-notes
