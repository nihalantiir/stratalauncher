name: Publish media assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bump this when media-assets/videos content actually changes"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip videos
        id: zip
        shell: pwsh
        run: |
          $zipName = "strata-media.zip"
          Compress-Archive -Path "media-assets/videos/*" -DestinationPath $zipName
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Write media.json
        shell: pwsh
        run: |
          $manifest = @{
            version = [int]"${{ inputs.version }}"
            url = "https://github.com/${{ github.repository }}/releases/download/media-v1/${{ steps.zip.outputs.zip_name }}"
            sha256 = "${{ steps.zip.outputs.sha256 }}"
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path media.json -Encoding utf8

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exists = gh release view media-v1 2>$null
          if (-not $exists) {
            gh release create media-v1 --title "media-v1" --notes "Background videos for the launcher UI, downloaded on first launch." --latest=false
          }
          gh release upload media-v1 "${{ steps.zip.outputs.zip_name }}" "media.json" --clobber
