[package]
name = "strata"
version = "0.1.9"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "strata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "time", "sync"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = "4.2.0"
sha1 = "0.11.0"
sha2 = "0.10"
hex = "0.4.3"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls", "stream", "multipart"] }
md5 = "0.8.1"
futures-util = "0.3.34"
zip = "8.6.0"
flate2 = "1.0"
tauri-plugin-dialog = "2.7.3"
dotenvy = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_SystemInformation"] }
winreg = "0.55"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
